name: Apply Matixray update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Apply the update
        run: |
          test -f matixray-patch.zip
          unzip -o matixray-patch.zip -d .
          rm -f \
            V2rayNG/app/src/main/res/drawable-nodpi/ic_matixray_logo.png \
            V2rayNG/app/src/main/res/drawable-nodpi/ic_pattng_logo.png \
            V2rayNG/app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png \
            V2rayNG/app/src/main/res/mipmap-hdpi/ic_launcher_monochrome.png \
            V2rayNG/app/src/main/res/mipmap-xhdpi/ic_launcher_monochrome.png \
            V2rayNG/app/src/main/res/mipmap-xxhdpi/ic_launcher_monochrome.png \
            V2rayNG/app/src/main/res/mipmap-xxxhdpi/ic_launcher_monochrome.png
          rm -f matixray-patch.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply Matixray UI update"
          git push
